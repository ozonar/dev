name: AI Review

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  ai-review:
    runs-on: ubuntu-latest
    env:
      LLM_ENDPOINT: https://3qa.ru/api/v1/chat/completions
      LLM_MODEL: deepseek/deepseek-v4.1-flash
      LLM_TOKEN: ${{ secrets.LLM_REVIEW_TOKEN }}
    steps:
      # Без токена ревью невозможно: падаем, чтобы ошибка конфигурации
      # не маскировалась зелёным статусом job.
      - name: Check AI credentials
        run: |
          if [ -z "$LLM_TOKEN" ]; then
            echo "::error::Set the LLM_REVIEW_TOKEN secret."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Полная история нужна для diff с базовой веткой.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - name: Build dev
        run: go build -trimpath -o "$RUNNER_TEMP/dev" ./cmd/dev

      # PR: проверяются изменения относительно базовой ветки.
      # Push: проверяется последний коммит.
      # Команда завершается с кодом 1 при критических проблемах, поэтому
      # job падает и блокирует merge.
      - name: Run AI review
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SCOPE="--branch=${{ github.base_ref }}"
          else
            SCOPE="--commit=1"
          fi
          "$RUNNER_TEMP/dev" review ai $SCOPE 2>&1 | tee "$RUNNER_TEMP/ai-review.log"

      - name: Publish AI review summary
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/ai-review.log" ]; then
            {
              echo "## AI code review"
              echo '```'
              cat "$RUNNER_TEMP/ai-review.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
