name: AI Review

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  ai-review:
    runs-on: ubuntu-latest
    # Параметры LLM передаются в окружение процесса: dev читает их как
    # значения конфига. Токен хранится только в secrets, не в репозитории.
    env:
      LLM_ENDPOINT: ${{ vars.LLM_ENDPOINT }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_TOKEN: ${{ secrets.LLM_TOKEN }}
    steps:
      # Без настроенных параметров ревью невозможно: job пропускается,
      # чтобы не падать в форках, где secrets недоступны.
      - name: Check AI credentials
        id: creds
        run: |
          if [ -z "$LLM_ENDPOINT" ] || [ -z "$LLM_TOKEN" ] || [ -z "$LLM_MODEL" ]; then
            echo "AI review skipped: set LLM_ENDPOINT and LLM_MODEL repository variables and the LLM_TOKEN secret."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.creds.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          # Полная история нужна для diff с базовой веткой.
          fetch-depth: 0

      - name: Set up Go
        if: steps.creds.outputs.enabled == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - name: Build dev
        if: steps.creds.outputs.enabled == 'true'
        run: go build -trimpath -o "$RUNNER_TEMP/dev" ./cmd/dev

      # PR: проверяются изменения относительно базовой ветки.
      # Push: проверяется последний коммит.
      # Команда завершается с кодом 1 при критических проблемах, поэтому
      # job падает и блокирует merge.
      - name: Run AI review
        if: steps.creds.outputs.enabled == 'true'
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SCOPE="--branch=${{ github.base_ref }}"
          else
            SCOPE="--commit=1"
          fi
          "$RUNNER_TEMP/dev" review ai $SCOPE 2>&1 | tee "$RUNNER_TEMP/ai-review.log"

      - name: Publish AI review summary
        if: always() && steps.creds.outputs.enabled == 'true'
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/ai-review.log" ]; then
            {
              echo "## AI code review"
              echo '```'
              cat "$RUNNER_TEMP/ai-review.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
