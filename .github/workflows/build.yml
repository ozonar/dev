name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact_name: dev-linux-amd64
            output_name: dev
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact_name: dev-windows-amd64.exe
            output_name: dev.exe
          - os: macos-latest
            goos: darwin
            goarch: amd64
            artifact_name: dev-darwin-amd64
            output_name: dev
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact_name: dev-darwin-arm64
            output_name: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'

      - name: Determine version
        id: version
        shell: bash
        run: |
          REF="${{ github.ref }}"
          case "$REF" in
            refs/tags/*)
              TAG="${REF#refs/tags/}"
              # Remove leading 'v' if present
              VERSION="${TAG#v}"
              ;;
            *)
              # Use git describe for snapshot version
              VERSION=$(git describe --tags --always --dirty)
              ;;
          esac
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          go build -v -trimpath -ldflags="-X dev/internal/version.Version=$VERSION -s -w" -o ${{ matrix.output_name }} ./cmd/dev

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_name }}
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'

      - name: Run tests
        run: go test ./...

      # Кросс-проверка компиляции под macOS без выделенных раннеров:
      # ловит поломки платформенных адаптеров в обычных PR.
      - name: Cross-build check (darwin)
        run: |
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/dev
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/dev

      # Vet компилирует тестовые файлы, поэтому проверяет и darwin-тесты.
      - name: Cross-vet tests (darwin)
        run: |
          GOOS=darwin GOARCH=amd64 go vet ./internal/toolchain/... ./internal/check/...
          GOOS=darwin GOARCH=arm64 go vet ./internal/toolchain/... ./internal/check/...

  release:
    needs: [ build, test ]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Upload Linux executable
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: artifacts/dev-linux-amd64/dev
          asset_name: dev-linux-amd64
          asset_content_type: application/octet-stream

      - name: Upload Windows executable
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: artifacts/dev-windows-amd64.exe/dev.exe
          asset_name: dev-windows-amd64.exe
          asset_content_type: application/octet-stream

      - name: Upload macOS Intel executable
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: artifacts/dev-darwin-amd64/dev
          asset_name: dev-darwin-amd64
          asset_content_type: application/octet-stream

      - name: Upload macOS Apple Silicon executable
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: artifacts/dev-darwin-arm64/dev
          asset_name: dev-darwin-arm64
          asset_content_type: application/octet-stream